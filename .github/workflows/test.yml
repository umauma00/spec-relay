name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      # Windows is the main platform: one job failing must not cancel the others.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # 22.20.0 is the lowest Node.js the pinned OpenSpec supports (doctor's NODE_MIN).
        node: ['22.20.0', 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The tests install the pinned OpenSpec into each temporary repository with
      # npm ci. A global OpenSpec of another version must never be used.
      - run: npm install -g @fission-ai/openspec@1.17.0
      - run: npm test
  old-node:
    # doctor.mjs must explain an old Node.js instead of stopping on a SyntaxError.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
      - name: doctor reports the old Node.js
        shell: bash
        run: |
          set +e
          node scripts/doctor.mjs --json > out.json
          code=$?
          cat out.json
          test "$code" = 1 && grep -q '"id": "node"' out.json
  e2e:
    # The screen tests for real: the template's pinned Playwright installed with
    # npm ci, driving the browser the runner has (Edge on Windows, as on the
    # users' Windows 11; Chrome on Ubuntu), against two small systems.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      SPEC_RELAY_E2E_REAL: '1'
      SPEC_RELAY_E2E_CHANNEL: ${{ matrix.os == 'ubuntu-latest' && 'chrome' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test --test-name-pattern "Playwright runs" tests/e2e.test.mjs
