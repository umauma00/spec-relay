name: spec-relay-target
version: 1
description: spec-relay step 2 - decide once how the new system is built (modules per bounded context, conventions, screens, verification), then gate it on a human review
artifacts:
  - id: architecture
    generates: architecture.md
    description: Module structure of the new system, one module per bounded context
    template: architecture.md
    instruction: |
      Design the structure of the new system from the archived survey's
      context-map.md (`openspec/changes/archive/*-survey*/context-map.md`, the
      newest one). Every port follows this design, so decide it once here.

      Default style: a modular monolith in the manner of Spring Modulith. Use
      another style only when the person asks for it, and write down why.
      - One module per bounded context, plus `platform`. A module's folder is
        its context id.
      - A module exposes a public API (and the domain events it publishes) and
        hides everything else. Other modules use only that API or subscribe to
        those events; they never reach into another module's internals or its
        tables.
      - Each table or file has exactly one owning module (from the survey's
        shared data). Only the owner writes it.
      - Dependencies between modules follow the context map's relationships
        and form no cycle. An anti-corruption layer from the map becomes an
        adapter inside the downstream module.
      - The boundaries are checked by an automated test that runs with the
        other tests. Pick the tool of the target language, for example: Java -
        Spring Modulith `ApplicationModules.verify()` (or ArchUnit); TypeScript
        - dependency-cruiser or eslint-plugin-boundaries, with an `index.ts` per
        module as its public API; Python - import-linter contracts; C# -
        ArchUnitNET or NetArchTest. Name the exact command.

      Sections:
      - **Style**: the style and, if not the default, why.
      - **Modules**: table of context, module path under the target root,
        public API, events published, depends on.
      - **Data ownership**: table of table/file and owning module.
      - **Boundary check**: tool, rules and the command that runs them.
      - **Layout**: the folder tree of the target root.
    requires: []

  - id: conventions
    generates: conventions.md
    description: Rules every port follows - language mapping, frameworks, coding style, commands
    template: conventions.md
    instruction: |
      Decide the rules that every port change follows, so that ports of
      different capabilities stay consistent. A port's design.md may only add
      to these rules for its own capability, never contradict them.
      - **Runtime and frameworks**: language version, frameworks and main
        libraries, with the reason for each.
      - **Language mapping**: the semantic differences between the source and
        target languages and the rule for each: numbers, decimal and rounding;
        strings, encodings (legacy Shift_JIS or EUC-JP data becomes what?) and
        collation; dates, times and time zones; null and optional values;
        errors and exceptions; collections and ordering; concurrency; I/O.
      - **Coding conventions**: naming, error handling, logging, tests.
      - **Commands**: build, test, lint and the boundary check, as one-line
        commands that run in PowerShell on Windows, from the target root. Keep
        the purposes `Test` and `Boundary check` as they are: the kit's
        `verify.mjs` runs those two for every port and records the result. Each
        must exit with a code other than 0 when it fails, so write one command,
        not a chain whose last part always succeeds.
    requires:
      - architecture

  - id: ui
    generates: ui.md
    description: How the screens are built in the new system and how close their look stays to today's
    template: ui.md
    instruction: |
      Decide once, for every context, how its screens (web pages, forms,
      dialogs, printed reports) are built in the new system and how much of
      today's look they keep. Every extract and port follows this file, so
      the look does not drift from one port to the next. Read the archived
      survey (inventory.md for the files marked carry, context-map.md for
      each context's entry points) and the screens themselves; what only the
      person knows (who uses the screens, whether manuals, training or printed
      forms show them, and which target UI technology they want) is in their
      answers in the target design's proposals.md (P6), which the task names.

      Sections:
      - **Screens**: a table with at least one row per context: context id,
        which screens the row covers (`all`, names, or a kind such as printed
        reports), the source kind (PHP pages, ASP.NET WebForms, ASP.NET MVC,
        WinForms, WPF, printed report, none), the target framework and
        template engine, the policy and why. A context may have several rows
        (screens `layout`, printed reports `same`). Policy is one of:
        - `same`: the look stays too. Web to web, keep the markup structure
          and the ids and classes the stylesheets select on, and carry the
          stylesheets, images and fonts unchanged. Printed reports keep their
          page layout.
        - `layout`: the regions, order, labels, positions, sizes, tab order
          and keys stay; the new toolkit draws the controls in its own look.
          The usual choice when a WinForms or WPF form becomes a web page or
          another desktop toolkit, where the same pixels are not realistic.
        - `new`: a new look under the Shared look. Items, labels, messages,
          order and transitions still follow screens.md.
        - `none`: the context has no screens.
        Propose the policy; the person decides. Suggest `same` when users are
        many or are trained on the screens, when manuals or forms show them,
        for printed or submitted documents, and web to web (carrying the
        stylesheets is cheap). Suggest `layout` from desktop to anything, and
        from ASP.NET WebForms when the rendered HTML cannot be taken from the
        running program. Never choose `new` on your own.
      - **Shared look**: what all screens share: base layout or master page,
        stylesheets or theme, fonts, colours, window or viewport size, DPI and
        scaling (WinForms AutoScaleMode), supported browsers. For `layout`
        from desktop, how designer positions and sizes map to the target
        (pixels, a grid, or relative layout).
      - **Carried files**: a table `| Source | Target |` with one row per
        carry row of the inventory, with the same path, and the folder or file
        under the target root that receives it. A source folder (ending in
        `/`) needs a target folder ending in `/`; a file sent to a folder also
        ends the target with `/` and keeps its name. Never a target under
        `openspec/` or on a source file. A carried file is copied unchanged
        (text may differ only in CRLF or LF line endings); `gate.mjs
        port-done` compares the copy with the source. Write "None" under the
        heading when nothing is carried; keep the heading.
      - **Client-side scripts**: the script libraries carried as they are,
        the scripts that are ported, and why. What a script makes users see
        (validation, enabling items, calculations in the browser) is behavior
        and belongs in the specs either way.
    requires:
      - architecture

  - id: verification
    generates: verification.md
    description: How each context proves the new code behaves like the old one
    template: verification.md
    instruction: |
      Choose, per context, how the port proves it behaves like the source
      program. The person chose the levels in the target design's
      proposals.md (P4, P3 and P5), which the task names; offer the lightest
      level that is enough when you recommend one there.
      - **A - scenario tests** (every context, required): each spec scenario
        becomes a test in the target language.
      - **B1 - logic comparison**: record what the source program does as
        cases (input and output) and run the same inputs through the new code,
        with the kit's compare (docs/COMPARE.md). For contexts with
        calculations and business rules. The cases come from one of three
        places, by how the source program can be run:
        - *direct*: a small recorder calls the source code's logic by itself,
          without screens or sign-in (C#: a console project or test that
          references the old assemblies; PHP: a CLI script that includes the
          old files). Needs logic that can be called by itself and builds here.
        - *over HTTP*: when the logic sits in a page or a code-behind and
          cannot be called by itself (code at the top of a PHP page, ASP.NET
          WebForms event handlers, a controller that only runs in its server),
          the kit's `http.mjs` sends requests to the RUNNING source program
          and records what it answers (status, redirect, the text a user
          reads, the form fields, JSON, CSV). Needs a test copy of the old
          system that the person runs, with its own test database.
        - *production records*: records of the program's real runs brought in
          when it cannot run here (batch input and output files, report data,
          rows the program wrote), with personal data masked.
        Suggest B1 whenever one is possible: it is the level that compares
        with the source program instead of with what an AI read. Write the
        way (direct, HTTP, records) in the context's Notes cell.
      - **B2 - screen tests**: every scenario a user performs on a web
        screen becomes a Playwright test (kit's `e2e.mjs`,
        docs/E2E.md). The same test runs first against the running old
        system, which proves the test, and then, unchanged, against the new
        one. Tests find elements by what a user sees (role, label, text),
        never by ids or classes, which differ between the two systems. Needs a
        test copy of the old system the person runs, with a test database
        both systems can be reset to. Suggest it for every context with web
        screens whose old system can run here. Playwright drives browsers
        only: desktop screens (WinForms, WPF, VB6) cannot have B2; their
        scenarios are checked by unit tests (and B1 where the logic can be
        called).
      - **C - screenshot comparison**: for web screens, the B2 tests also take
        screenshots on the old system (`toHaveScreenshot`), and the new
        system must match them; C needs B2 for those screens. For screens
        whose design must stay the same: suggest it for contexts with the
        policy `same` in ui.md, and consider it for `layout`. For desktop
        screens the kit has no tool: a port task captures and compares them.

      B2 and C apply to the capabilities that have screens. A capability
      whose reviewed extract says it has none (screens.md `None`, confirmed
      as S0) skips them in its port, mechanically, whatever this table says
      for its context. So choose B2 and C for a context when any of its
      capabilities has web screens; never split a context by screens.

      Each scenario of a port is then checked one way, decided in the port's
      design.md: `e2e` (B2, screens), `compare` (B1, logic and outputs such
      as APIs, batches and reports) or `unit` (a test in the target language,
      for the fine branches of calculations and rules).

      Each port gives the command of every chosen level in its design.md, and
      `gate.mjs port-done` fails until that command passed on the current
      code. A context with only A is reported as "inferred": the source program
      never ran, so equivalence rests on reading the code. Say so when the
      person chooses.

      Sections:
      - **Levels**: table of context, A (always yes), B1, B2, C, notes. Write
        each level cell as `yes` or `no` only: `gate.mjs review` stops on
        anything else, so an open choice is a question, not a cell.
      - **Running the source program**: what is needed to run it for B1, B2 or
        C, or "not runnable". When it is not runnable, say which records of
        its real runs exist (B1 can still use them) or "none" (then only A
        applies). For B1 over HTTP, B2 and C: the address of the test copy
        the person runs (for example `http://localhost:8080`), its encoding
        when it is not UTF-8 (Shift_JIS, EUC-JP), and how its test database
        is put back to the starting state before a recording, best as one
        command that also resets the new system's test database (screen tests
        run it before each run with `--reset`). Requests can
        change data: a system on another machine is written here only when
        the person names it as a test system, and nothing here may ever
        point at production.
      - **Sign-in**: for B1 over HTTP, B2 and C, the test account comes from
        environment variables the person sets (name the variables; a recorded
        request holds `{{env:NAME}}` in their place). Never write a
        password, token or connection string into any file.
      - **Recorded data**: where recorded inputs, outputs and screenshots live
        (under the target root's tests; B1 cases in
        `tests/golden/<capability with - for />/`, screen tests and their
        screenshots in `tests/e2e/<capability with - for />/`), how to
        re-record them, and
        how personal data in records is masked before they are committed.
    requires:
      - architecture
      - ui

  - id: data
    generates: data.md
    description: How the new system uses the database - schema policy, logic in the database, dialect and ORM rules, test database
    template: data.md
    instruction: |
      Decide once how every port uses the databases of the archived survey's
      database.md (`openspec/changes/archive/*-survey*/database.md`, the newest
      one). When it says None, write only "None" under the first heading.
      Keep the template's English headings and table headers, and the words
      `keep` and `move`: `gate.mjs review` reads them. The code cannot tell
      you how the switch to the new system will happen: follow the person's
      answer in the target design's proposals.md (P7), which the task names.

      The migration keeps behavior, so the default keeps the database as it is.
      - **Schema policy**: `keep` (the default: the new code reads and writes
        the same tables, columns and types; no data migration) or `same
        structure on <product>` (another product with the same tables; data
        migration and the dialect rows below then matter, and the data
        migration is a separate task you name here). Redesigning the schema is
        follow-up work after the migration, never part of it. Also write how
        old and new run during the switch: all at once, or side by side on the
        same database (then nothing may change the schema, and logic in the
        database stays there, because the old system still relies on it).
      - **Database logic**: table of kind (every kind in database.md's Logic in
        the database), handling and reason. Handling is `keep` (stays in the
        database; the module calls or relies on it) or `move` (re-implemented
        in the module that owns the table). Defaults: keep triggers,
        constraints, sequences and views, because they act on every writer,
        including the old system and manual SQL; keep procedures and functions
        unless the product changes. A job's steps are specified like batch
        capabilities either way; `keep` leaves it scheduled in the database
        (SQL Server Agent, MySQL events), `move` schedules it in the new
        system, and is chosen only when the person says so.
      - **Exceptions**: table of object, handling and reason, for objects
        handled unlike their kind. "None" when there are none.
      - **Data access mapping**: table of topic, source behavior and target
        rule, for differences between the old and new data access that change
        results: trailing spaces in comparisons, empty string and NULL, order
        of rows without ORDER BY, collation (case, full-width and half-width,
        kana), date and time precision and time zone, numbers and rounding in
        SQL, keys and numbering (identity, sequences), transactions, isolation
        and locks, character set, and ORM behavior (lazy loading, batching,
        caching, generated SQL). Read the source code and definitions for what
        the old system relies on.
      - **Schema changes**: the data access library and the exact setting
        that stops it from creating or changing the schema (for example
        Hibernate `spring.jpa.hibernate.ddl-auto=validate`, no EF Core
        migrations, no `prisma migrate`). Nobody changes the schema or the
        database objects during the migration.
      - **Test database**: how tests get a database built from the
        definitions (product and edition, how the definitions are loaded),
        as one-line commands that run in PowerShell on Windows. Prefer what
        runs on Windows 11 without a paid licence (SQL Server Express or
        LocalDB, the product's own installer); use a container only when the
        person chooses it. Names of environment variables only, never a
        connection string or password.
    requires:
      - architecture

  - id: review
    generates: review.md
    description: Human review checklist of the target design
    template: review.md
    instruction: |
      Build the checklist the HUMAN reviewer works through.
      Write it with `node "<kit>/scripts/draft.mjs" review --change <change>`,
      which builds this list from the artifacts; after a change that adds,
      renames or removes a subject, run it again with `--update`, which keeps
      the reviewer's ticks, decisions and notes. Do not retype the list.
      - Keep the `Reviewer:` line.
      - Under `## 1. Architecture`: one checkbox for the style, one per module
        (`- [ ] A<n> <module>`), one for data ownership, one for the boundary
        check.
      - Under `## 2. Conventions`: one checkbox per section of conventions.md.
      - Under `## 3. Verification`: one checkbox per context's levels, and one
        for sign-in and recorded data.
      - Under `## 4. Screens`: one checkbox per context's screen rows in ui.md
        (`- [ ] U<n> <context>: screens`), and `- [ ] U90` for the shared
        look, the carried files and the client-side scripts.
      - Under `## 5. Data`: `- [ ] D0 The schema policy`, one per kind in
        data.md's Database logic (`- [ ] D<n> <kind>: <handling>`, numbered
        from D1, with the same keep or move as data.md), `- [ ] D90 The
        exceptions`, `- [ ] D91 The data access mapping` and `- [ ] D92 The
        schema changes and the test database`. Leave the heading empty when
        data.md says None.
      Keep the template's fixed items (A0, A90, A91, V1-V4, E90, U90) also
      when a section holds little: `gate.mjs review` fails when one is
      missing, because each is a decision only the person can take.
      Do not tick any box. Only the reviewer decides.
    requires:
      - architecture
      - conventions
      - ui
      - verification
      - data

apply:
  requires: [ review ]
  tracks: review.md
  instruction: |
    Applying this change is the HUMAN REVIEW of the target design. It writes no
    code.

    Render the review page (`render.mjs --change <change>`) and give the person
    its path. Walk the reviewer through review.md one item at a time and ask
    them to accept it or ask for a change.
    - Tick a box only after the reviewer explicitly accepts that item in this
      conversation, or when the reviewer ticked it themselves.
    - A line `  - fix: ...` under an item is the reviewer asking for a change
      (written in the file or with the canvas); `  - hold: ...` means they
      cannot decide yet. Answer each fix by correcting the artifacts and
      writing `  - fixed: <what you changed>` under it; keep the item
      unticked. Never delete or reword the reviewer's notes.
    - When the reviewer asks for a change, edit the artifacts, untick every
      item you changed, render again, and ask again.
    When every box is ticked and `gate.mjs review` passes, archive only after
    the reviewer says so.
