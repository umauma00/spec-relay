name: spec-relay-port
version: 1
description: spec-relay step 5 - implement reviewed baseline specs in the target language, reading the original code for detailed logic
artifacts:
  - id: proposal
    generates: proposal.md
    description: Which baseline capabilities this change ports, and to where
    template: proposal.md
    instruction: |
      State what this port covers. A port does not change behavior: the
      baseline specs in `openspec/specs/` are the contract.

      Sections:
      - **Capabilities**: The exact baseline spec paths being ported (run
        `openspec list --specs`). Only capabilities whose extract change was
        reviewed and archived may be listed.
      - **Target**: Target language, runtime and the output directory.
      - **Order**: Why these capabilities now; what they depend on that is
        already ported or still in the source language.
      - **Out of scope**: Anything left for a later port.
      - **Follow-up**: Empty at first. When the port ends with a `TODO(port)`
        that cannot be finished in it, and the person agrees to leave it for
        later, one list item per target file: `` - `<path>` - what is
        left (agreed by <name>) ``, the path from the repository root or the
        target root. `gate.mjs port-done` fails on every
        `TODO(port)` in a file not listed here or in an archived port's
        Follow-up.
      - **Baseline**: one line per capability, `` `<capability>` sha256:<hash> ``,
        with the hash printed by `node "<kit>/scripts/gate.mjs" baseline
        --capability <capability>`. `gate.mjs port-done` fails when the
        baseline changed after this line was written (an amendment was
        archived): update the port to the new baseline, then the line.

      Port changes carry no spec deltas. Keep `skip_specs: true` in the
      change's `.openspec.yaml`. If the port would need a behavior change,
      stop and propose it as a separate change after the migration.
    requires: []

  - id: design
    generates: design.md
    description: How the reviewed behavior maps onto the target language
    template: design.md
    instruction: |
      Explain HOW to implement the baseline specs in the target language,
      inside the target design of the newest archived `target-design` change
      (`openspec/changes/archive/*-target-design*/`): its architecture.md,
      conventions.md, ui.md and verification.md. Follow them; do not
      re-decide them.

      Run `node "<kit>/scripts/draft.mjs" port-design --change <change>`
      first: it writes the Screens, Scenario checks and Source references
      tables below from the files they copy (with `--update` after an
      amendment). Do not retype them.

      Sections:
      - **Structure**: The module of this capability's context (from
        architecture.md), the files inside it, its public API additions and
        the events it publishes or consumes. Never reach into another module's
        internals or write a table another module owns.
      - **Language mapping**: Only additions to conventions.md that these specs
        need. If a spec needs a rule that contradicts conventions.md, stop and
        ask the person.
      - **Screens**: For each screen in the extract change's screens.md
        (`openspec/changes/archive/*-extract-<capability>/screens.md`), its
        policy from ui.md, the target page or form, and how the design is
        kept under that policy. If the archived target design has no ui.md
        (made before kit 0.8.0), ask the person for each screen's policy and
        write their answer under Decisions; never choose it yourself.
        - `same`: the markup keeps the structure and the ids and classes of
          Look details, the carried stylesheets, images and fonts are linked
          unchanged, and the page looks as it does today.
        - `layout`: regions, order, labels, positions and sizes from Look
          details (mapped as ui.md's Shared look says), tab order and keys
          are kept; the target toolkit draws the controls.
        - `new`: the Shared look of ui.md; items, labels, messages, order and
          transitions are still those of screens.md.
      - **Carried files**: a table `| Source | Target |` of the files this
        port copies unchanged: carry rows of the survey's inventory, placed
        exactly where ui.md's Carried files says. A folder row (ending in `/`)
        copies the carry files below it (not the files a more specific
        inventory row marks port); a target ending in `/` receives the file
        under its own name. `gate.mjs port-done` fails when a copy differs
        from its source (text may differ only in CRLF or LF line endings) or
        goes elsewhere than ui.md says. A file that needs any edit is ported,
        not carried: leave it out here and say why under Decisions. Keep the
        heading and write "None" under it when the port carries nothing.
      - **Data access**: For each table and database object in the extract
        change's source-map.md, how the module reaches it, following the
        target design's data.md: `keep` objects are called or relied on as
        they are, `move` objects are re-implemented here (name the file). Write
        "None" when the capability uses no database. Never change the schema or
        a database object; if the port would need it, stop and ask the person.
      - **Verification**: A table `| Level | Covers | Command |`, one row for
        A and one for each of B1, B2 and C that verification.md chose for this
        context, with what it covers here. When the screens.md of the
        capability's archived extract says None, B2 and C do not apply: no
        row for them (`gate.mjs port-done` stops on one), and no scenario is
        `e2e`. Command is the one-line command
        that runs the level in the target root (PowerShell on Windows); for A
        leave it empty to use conventions.md's Test command. Add a
        `Boundary check` row with a command only when conventions.md's does
        not fit this port. For B1 with recorded cases, the command is
        `spec-relay-compare --cases tests/golden/<capability with - for />
        --driver "<command that runs the driver>"` (docs/COMPARE.md): the
        kit compares, case by case, the source program's recorded output with
        the new code's. For cases recorded over HTTP (verification.md says
        so), the driver is the kit's own: `--driver "spec-relay-http --base
        http://localhost:<port> --start '<command that starts the new
        system>'"`, with `--map tests/golden/http-map.json` when the new
        system's paths or field names differ on purpose; the run starts the
        new system, sends it the recorded requests and stops it. Every rule
        in the cases folder's `rules.json` loosens the comparison, and so
        does every line of the map: list each under Decisions with the
        reason. For B2 (web screens), the command is the kit's screen tests
        (docs/E2E.md): `spec-relay-e2e --base http://localhost:<port>
        --start '<command that starts the new system>'`, with `--reset
        '<command>'` when verification.md resets the test database with a
        command. When C is chosen for web screens, its row has the same
        command: the one run compares the screenshots the tests took on the
        old system. The kit's
        `verify.mjs` runs these commands and the boundary check and records the
        result; `gate.mjs port-done` fails without a passing run on the
        current code.
      - **Scenario checks**: a table `| Requirement | Scenario | Check |`
        with one row for every scenario of the baseline spec (names exactly
        as there), saying how it is checked: `e2e` when a user performs it on
        a web screen (a Playwright test, B2), `compare` when a recorded case
        of B1 covers it (logic and outputs: APIs, batches, reports; the case
        carries the scenario's tag in a `"scenario"` key), `unit` otherwise
        (fine branches of calculations and rules, desktop screens, anything
        the source program cannot show). Choose `e2e` for every screen
        scenario when verification.md chose B2, and `compare` where B1
        records the scenario. Required when design.md has a B1 or B2
        command; without one every scenario is `unit` and the section may
        say "None". `gate.mjs port-done` fails for a scenario without a row,
        and for a row whose evidence is missing: a tagged unit test outside
        `tests/e2e/`, a tagged recorded case, or a screen test titled with
        the tag that passed on the old system and then on the new one.
      - **Source references**: For each requirement, the source locations from
        the archived extract change's trace.md
        (`openspec/changes/archive/*-extract-<capability>/trace.md`), and from
        any later archived amendment's trace.md, which wins for the
        requirements it lists. Implementers read the original logic there for
        details the spec leaves open.
      - **Decisions**: Choices with the alternatives considered.
      - **Risks**: [Risk] -> Mitigation.

      Never change behavior to suit the target language. When the target cannot
      express a behavior exactly, write it down here and ask the person.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist, one requirement group per task group
    template: tasks.md
    instruction: |
      Break the port into tasks the apply phase can track.
      - Group tasks under `## <n>. <group>` headings; each tracked task is
        `- [ ] <n>.<m> <description>`.
      - Every implementation task names the requirement(s) it implements, the
        target file, the source reference to read, and how it is verified.
      - Verification comes from the spec scenarios: each scenario becomes a test
        in the target language, landed in the same group as its code. Each such
        test carries the tag
        `spec-relay: <capability> | <requirement name> | <scenario name>` in a
        comment, or as its whole test name (the string starts with
        `spec-relay:`), with the names exactly as in the baseline spec; `gate.mjs port-done` fails for a scenario without a tagged test. A
        scenario with a database effect checks the rows afterwards, on the test
        database of data.md.
        A scenario that design.md's Scenario checks gives `e2e` or `compare`
        gets its test from that level instead (below), with the same tag.
        Add tasks for the other levels design.md names: B1 record source
        outputs and compare, B2 screen tests, C screenshot comparison. For B1 with
        `spec-relay-compare`: one task writes the recorder for the source code
        (or the conversion of its records) and records the cases, with inputs
        for every scenario and for the edge cases of the Language mapping; one
        writes the driver that runs the inputs through the new code. Over
        HTTP, the first task writes the requests
        (`tests/golden/inputs/<capability>.jsonl`, outside the cases folder)
        and records them from the running source program with the kit's
        `http.mjs record`, after the person confirmed that the test copy runs
        and its database is at the starting state; no driver is written, and
        a second task writes the map when design.md names one. Give each
        request or input of a `compare` scenario its tag in a `"scenario"`
        key (`http.mjs record` keeps it in the case). For B2: one task writes
        the screen tests in `tests/e2e/<capability with - for />/`
        (`node "<kit>/scripts/e2e.mjs" init` creates `tests/e2e/` the first
        time, then `npm ci` there), one Playwright test per `e2e` scenario,
        titled exactly with its tag, finding elements by role, label and text
        only, signing in with values from environment variables (support.mjs
        `secret`), and, when C is chosen, taking `toHaveScreenshot` of each
        screen of screens.md the scenario shows. A second task, done by the
        orchestrator and never by a subagent, runs them against the old
        system with `node "<kit>/scripts/e2e.mjs" old --change <change>
        --base <old system's address>`, after the person confirmed that the
        test copy runs at the address verification.md names and that its
        database is at the starting state; every test must pass there before
        the new code is judged by it. A test that fails on the old system is
        fixed, never the old system. The old system is stopped before verify
        runs the tests on the new one.
      - When design.md lists carried files, one task copies them unchanged.
      - The last group runs the boundary check from conventions.md.
      - Order by dependency. A final group may only run integration checks and
        compare results with the source program when it can run.
      - Do not add tasks for the verify run or the crosscheck: they follow the
        tasks (see crosscheck).
    requires:
      - design

  - id: crosscheck
    generates: crosscheck.md
    description: An independent AI check of the new code against the source code, per requirement and screen
    template: crosscheck.md
    instruction: |
      Written after every task is done and the kit's `verify.mjs` passed. Give
      this to `spec-relay-checker` subagents (port check): they receive the
      baseline spec, the archived extract change's screens.md and trace.md
      (and any later amendment's trace.md), this change's design.md, the
      archived target design's conventions.md and the target module's folder,
      never the implementer's reports, tasks.md or the lessons. For a large
      capability, several checkers take groups of items, each writes a part
      file, and the kit's `merge.mjs` merges them (see the spec-relay skill).

      For each requirement and each screen, the checker reads the source code
      the trace cites and the new code side by side, and the tests tagged for
      its scenarios (screen tests in `tests/e2e/` too), and the row of each
      scenario in design.md's Scenario checks (a scenario a user performs on
      a web screen is `e2e` when B2 was chosen), and decides:
      - `confirmed`: the new code does what the source code does, for every
        scenario and for the inputs the scenarios do not show (rounding, null
        and empty values, encodings, dates, ordering, errors, as listed in
        conventions.md's Language mapping), and the tagged tests check the
        scenario's values. A difference design.md's Decisions settled with
        the person counts as confirmed; cite the decision.
      - `mismatch`: the new code or its test does something else. Evidence:
        both locations and what each does.
      - `unclear`: the code does not settle it. Say what would.

      One table row per requirement (`R<n> <name>`, in baseline spec order) and
      per screen (`S<n> <name>`, in screens.md order). `merge.mjs` stamps the
      file with the hash of the target code it was merged on; port-done fails
      when the code changed since. Then resolve every row
      that is not `confirmed`: the implementer fixes the code or the test and a
      checker checks that row again; when the source code and the baseline
      spec disagree, stop and ask the person (an amendment if the spec misread
      the code). `gate.mjs port-done` fails while any row is missing,
      `mismatch` or `unclear`.
    requires:
      - tasks

apply:
  requires: [ tasks ]
  tracks: tasks.md
  instruction: |
    Implement the tasks in the TARGET language only. The source code is
    read-only: read it through the source references in design.md for logic
    the spec leaves open, and never edit it.
    - The baseline spec wins. When the source code and the spec disagree, stop
      and ask the person instead of choosing.
    - Mark a task done only after its verification passes; report the command
      and its result.
    - Write tests from the spec scenarios before or with the code they check,
      each tagged `spec-relay: <capability> | <requirement> | <scenario>`, of
      the kind design.md's Scenario checks gives the scenario.
    - A screen test (`tests/e2e/`) is proven on the old system before it
      judges the new one: never change it, or the screenshots it took, after
      `e2e.mjs old` passed without running `e2e.mjs old` again; when it fails
      on the new system, fix the new code.
    - Write only inside this context's module and its tests, and the carried
      files design.md lists; keep the module boundaries of architecture.md,
      and run the boundary check.
    - Copy carried files byte for byte and never edit them. Build each screen
      as design.md's Screens section says for its policy; do not restyle it.
    - Never change the database schema or a database object, and never run
      anything against a database other than the test database of the target
      design's data.md.
    - Leave a `TODO(port)` comment for anything unresolved and list it in your
      report. A stand-in for a capability that is not ported yet (a call into
      the old system, a temporary fake) gets one too, so the finish step finds
      it. The port is not done while one is left, unless the person agrees to
      leave it as follow-up work (a stand-in usually is).
    - When every task is done: run the kit's `verify.mjs`, then the crosscheck
      artifact, fix what it finds, run `verify.mjs` again, then
      `gate.mjs port-done`.
