name: spec-relay-extract
version: 1
description: spec-relay steps 3-4 - extract language-neutral specs from the source code, then gate them on a human review
artifacts:
  - id: source-map
    generates: source-map.md
    description: The source files, entry points and dependencies that make up this capability
    template: source-map.md
    instruction: |
      Map the part of the SOURCE code base (the code being migrated) that this
      capability covers. Read the code; do not guess from file names.

      Sections:
      - **Scope**: One or two sentences on what the capability does for its users.
      - **Source files**: Every file in scope, with its repository-relative path
        and a one-line role. Mark files that are only partly in scope. It must
        hold every file `openspec/spec-relay/plan.md` assigns to this
        capability (the indented items under it): `gate.mjs review` lists each
        one that is missing, and each listed path with no file on disk. That
        includes the database definition files under `openspec/spec-relay/db/`
        the plan assigns: give each one (or its folder) a row here too. When an
        assigned file belongs to another capability, report it instead of
        leaving it out; the orchestrator moves it in the plan.
      - **Entry points**: every way in: pages, the handlers of buttons and
        menus, routes, endpoints, commands, jobs, and public functions other
        capabilities call. One top-level item each, `path:symbol - how
        callers reach it` (the id in backticks when it holds spaces); the
        walkthrough starts from each. Write `- None (why)` only when nothing
        calls into the capability (definitions only); the gate refuses it
        when coverage.md judges code that writes, sends or ends a request
        covered.
      - **Dependencies**: Other capabilities, libraries, databases, files,
        environment variables and external services it uses.
      - **Database**: the tables it reads and writes, and the database objects
        that take part, with the path of each definition (archived survey's
        database.md): procedures and functions it calls, views it reads,
        triggers on the tables it writes (they run without being called),
        constraints and defaults that change or reject its data, and jobs that
        act on the same tables. "None" when it uses no database. This table
        names objects; the files that define them are rows of Source files.
      - **Out of scope**: Nearby code that belongs to another capability.

      Write every path relative to the repository root with forward slashes
      (`src/billing/Invoice.cs`), also on Windows.

      The source code is read-only. Never edit, format or move it.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Language-neutral behavior specs of the existing code
    template: spec.md
    instruction: |
      Write the CURRENT behavior of the source code as an OpenSpec delta with
      `## ADDED Requirements`. This change creates the baseline spec that the
      new implementation in the target language must satisfy. Use the terms of
      the context's glossary (archived survey, glossary.md).

      Describe behavior, not code:
      - Observable inputs, outputs, side effects, error conditions and limits.
      - Edge cases the code handles today, including odd ones: empty input,
        rounding, ordering, encodings, time zones, null handling, overflow.
      - What the database does is behavior too: a trigger's effect, a
        default, a constraint that rejects data, a procedure's result, the
        order a query returns rows in. Specify it like the rest, without naming
        the objects (they belong in trace.md).
      - Do NOT name classes, functions, libraries or language features of the
        source language. Those belong in trace.md.
      - Do NOT fix behavior. If the code looks wrong, still specify what it
        does, and raise it as a question for questions.md (the orchestrator
        writes that file from the doubts you report).
      - Behavior that runs on the screen itself is behavior too: client-side
        validation, items enabled or hidden by other items, totals computed
        in JavaScript or in form event handlers, confirmation dialogs. Write
        it here and trace it to the script or handler.

      Format (`openspec validate --strict` checks most of it):
      - New capability: the first section is `## Purpose`, one or two
        sentences of at least 50 characters.
      - `### Requirement: <name>` with SHALL/MUST, one behavior per requirement,
        description at most 500 characters.
      - Every requirement has at least one `#### Scenario: <name>` (exactly four
        hashes) with a **WHEN** or **GIVEN** step and a **THEN** step.
      - Use concrete values taken from the code or its tests in scenarios.

      An extract change covers one capability: write exactly one
      `specs/<capability-path>/spec.md`, using the capability path from the plan.
    requires:
      - source-map

  - id: screens
    generates: screens.md
    description: The screens of this capability as they look today - items, layout, wording, transitions
    template: screens.md
    instruction: |
      Record every screen (web page, form, dialog, report, printed output) of
      this capability as it is today, so the new system can keep the same
      design. Behavior (validation rules, calculations) belongs in the specs;
      this file holds what the user sees.

      One `### Screen: <name>` per screen, with:
      - **Entry**: URL, form or menu path, and the source file (path:symbol).
      - **Layout**: the regions from top to bottom and left to right.
      - **Look**: where the look comes from, with paths: the template, layout
        or master page, the stylesheets and theme, images and fonts. For a
        desktop form, the form's size, font, colours and scaling
        (AutoScaleMode, WPF styles and resources).
      - **Scripts**: the client-side scripts this screen loads (path) and what
        the user sees them do, or "none". The rules they enforce go into the
        specs as behavior.
      - **Items**: table of label (exact text), kind (text box, select,
        button, label, grid column...), required, format and limits, default,
        and read-only or editable.
      - **Look details**: a table with one row per item, so the new screen
        can be built to look the same. Web: the element and the ids and
        classes the stylesheets select on (the new markup must keep them for
        carried stylesheets to apply). Desktop: the control name, position
        (x, y), size (width, height), tab order, anchor or dock, and font or
        colour when it differs from the form's, read from the designer file
        (`*.Designer.cs`, `.resx`) or the XAML. Copy the numbers; do not
        round them.
      - **Actions**: buttons, links and keys, and what each does.
      - **Messages**: every message, title and confirmation, word for word,
        with when it appears.
      - **Transitions**: where each action leads.
      - **Screenshot**: the path of a screenshot under
        `openspec/spec-relay/screens/` if the person provided one; otherwise
        "none". Never invent one.
      Copy labels and messages exactly from the source (templates, resource
      files, string literals), including full-width characters and spacing.
      When the archived target design's ui.md gives this context the policy
      `new`, Look details may be left out (write "policy new"); everything
      else is still recorded. When the target design is not archived yet,
      record everything.
      ASP.NET WebForms renders server controls into HTML the source does not
      show (generated ids such as `ctl00_Main_txtName`, tables from
      GridView). Write what the control renders only when the source settles
      it; otherwise write the control and mark it "rendered markup not read".

      If the capability has no screens (a batch job, a library, start-up
      and configuration), write `None` under the heading. The person then
      confirms it in the review (item S0), and the ports of this capability
      skip the screen levels B2 and C of its context. So list every screen a
      user sees, even one the capability only shows (an error page), and
      write `None` only when there is none.
    requires:
      - source-map

  - id: trace
    generates: trace.md
    description: Trace from each requirement to the source code that implements it
    template: trace.md
    instruction: |
      For EVERY requirement in the specs, list where the source code implements
      it: repository-relative path with forward slashes, symbol, and line range
      when stable. Behavior that lives in the database points to its
      definition (`openspec/spec-relay/db/sales/dbo/Procedures/usp_Close.sql`,
      or the repository's `.sql` file) as well as to the code that reaches it. Step 5
      implementers read the original logic through this file, so make each
      reference precise enough to open directly.

      Also record existing tests that exercise the requirement, if any.
      A requirement with no source location is an error: either find it or
      report it, so the orchestrator moves it into questions.md.
      Cite every place the requirement's scenarios describe, not only where
      it starts: each database write, mail, file write, call to another
      system, error, exit and redirect the requirement specifies must be
      inside a line range (or the named member) of its row. The omission
      check reads this: a site counts as covered by a requirement only where
      that requirement's trace reaches its effect lines. Code outside
      functions (a PHP page's top-level code) has no symbol: cite its lines.
      `gate.mjs review` fails while a requirement has no row (first column:
      the requirement name, optionally after `R<n>`), a row names no
      `path:symbol` or `path:lines`, a path does not exist, or the lines are
      not in the file.
    requires:
      - specs
      - screens

  - id: crosscheck
    generates: crosscheck.md
    description: An independent AI check of every requirement and screen against the source code
    template: crosscheck.md
    instruction: |
      An INDEPENDENT check before the human review, so the person spends their
      attention on decisions instead of finding extraction mistakes. Give this
      to the `spec-relay-checker` subagent: it receives only specs, screens.md,
      trace.md and the source files they cite, never the analyst's notes, and
      it does not see this change's earlier drafts. For a large capability,
      several checkers take groups of items, each writes a part file, and the
      kit's `merge.mjs` merges them (see the spec-relay skill).

      The checker opens every trace reference (including database
      definitions) and decides for each requirement and each screen. For a
      requirement that writes a table, it also checks the triggers,
      constraints and defaults on that table that source-map.md lists:
      - `confirmed`: the source code does what the spec or screen says,
        including every scenario's values. For a screen this includes its
        Look, Scripts and Look details: the paths exist, the ids and classes
        are in the markup, and positions, sizes and tab order match the
        designer file or XAML.
      - `mismatch`: the code does something else. Evidence: the line and what it
        really does.
      - `incomplete`: what the text says is right, but the traced code does
        more that no scenario states: another branch or condition, an error
        case or message, a default, a limit, a rounding, a write. Evidence:
        each such line and what it does. A scenario that leaves out the
        value or the condition an implementer needs to reproduce the
        behavior is `incomplete` too.
      - `unclear`: the code does not settle it (configuration, data,
        unreachable branch).

      One table row per requirement (`R<n> <name>`, in spec order) and per
      screen (`S<n> <name>`), with verdict and evidence (path:line).
      Then resolve every row that is not `confirmed`: fix the spec, screens or
      trace and have the checker check that row again, or move it to
      questions.md and write `question Q<n>` as its verdict. `gate.mjs review`
      fails while any row is missing, `mismatch`, `incomplete` or `unclear`.
    requires:
      - trace

  - id: coverage
    generates: coverage.md
    description: The omission check - every site of the source map's files, and the requirement or screen that covers it
    template: coverage.md
    instruction: |
      An INDEPENDENT search for behavior the specs left out. The crosscheck
      confirms what the specs say; this finds what they do not say. Without
      it, a branch, an error case or a write that no requirement mentions is
      never ported, because the implementer adds nothing the spec lacks.

      `node "<kit>/scripts/sites.mjs" --change <change>` lists the sites of the
      files in source-map.md: methods, functions, constructors, properties
      with a body, constants, enum values (`<Enum>.(values)`), stored
      procedures, and `(file)`, the lines of a file that are in no other site
      and still do something (page code and HTML outside functions, top-level
      statements, field values, attributes and annotations, SQL outside
      procedures, code the scanner did not recognize; the whole file in a
      language it does not read, such as an .aspx page). It writes them in groups to
      `openspec/spec-relay/work/<change>/sites/<nn>.md`, each site with its
      lines and its markers (lines with words that usually mean an effect:
      db-write, db-read, transaction, error, exit, redirect, mail, file,
      session, input, config, time, rounding, external; also `long` for a line
      over 2000 characters the scanner did not read, `annotation` for PHP
      docblock annotations, `large` for a file over 32 MB). The Untraced
      column lists the site's effect lines (db-write, transaction, error,
      exit, redirect, mail, file, external) that the trace of NO requirement
      reaches: nobody read those lines for a requirement, so each is most
      likely behavior the specs left out. Give each group to a
      `spec-relay-checker` with the specs and screens.md; it writes
      `openspec/spec-relay/work/<change>/coverage/<nn>.md`, merged into this
      file by the kit's `merge.mjs`.

      One table row per site, with the site id exactly as listed:
      `| Site | Verdict | Evidence |`. The verdict is one of:
      - `covered R<n>, S<n>`: every observable effect of the site (results,
        errors, writes, messages, every marker line) is in these
        requirements' scenarios or these screens. Name the requirement of
        each effect line: the gate accepts the verdict only when the trace
        of a named requirement reaches every effect line of the site (a
        named screen may stand for a redirect and the exit that ends it,
        never for a write, a mail or an error). Markers are words, so a
        line may hold one and no effect (text of the page, script that runs
        in the browser, a word inside a string): only then add `; no effect
        <lines>` after the names (`covered R1, S1; no effect 6, 9`) and say
        per line in the evidence what the line is. The person confirms
        those lines in the review (C1). Never use it for a line that does
        something.
      - `no behavior`: the site has no effect a user or caller could notice
        (a plain getter, a constructor that only stores its arguments, a
        log line nobody reads). Say why in the evidence. When the site
        holds marker lines, the person confirms it in the review (C1).
      - `other capability <path>`: the site belongs to another capability of
        the plan (a god class split by method); the plan must list the file
        under that capability too.
      - `question Q<n>`: the person must decide (dead code, a branch that
        looks unreachable, behavior that may be a bug).
      - `gap`: the site does something no requirement or screen covers.
      The Verdict cell holds the verdict alone; reasons go in the Evidence cell.
      Files the survey marks `carry` are not scanned (a port copies them
      unchanged). Resolve every `gap`: an analyst adds the requirement it needs (with its
      trace), a checker checks the new requirement and that site again, or the
      orchestrator moves it to questions.md and writes `question Q<n>`.
      `gate.mjs review` scans the files again and fails while a site has no
      row, a row names a site the scanner does not find (delete such rows: a
      renamed member or a file that left the source map), a site has two rows,
      a verdict is blank or `gap`, a `no behavior` row has no evidence, a
      verdict names a requirement, screen, question or capability that does
      not exist, a `covered` row names no requirement whose trace reaches one
      of the site's effect lines, a chain of `other capability` verdicts comes
      back to this capability, or an in-scope source-map row names a file the
      scanner cannot read (excluded, ignored by git, outside the source root).
      When the gate reports an effect line no named requirement reaches: if a
      requirement's scenarios really describe that line, an analyst adds the
      line to that requirement's trace row and a checker crosschecks the
      requirement again; if the line holds no effect at all, the checker
      adds it to `; no effect <lines>`; if none of these, the site is a
      `gap`. Never widen a trace row to lines its requirement does not
      describe.
    requires:
      - trace

  - id: walkthrough
    generates: walkthrough.md
    description: The walkthrough - each entry point followed through the code, every behavior on the way and the scenario that states it
    template: walkthrough.md
    instruction: |
      An INDEPENDENT review of the specs from the outside in. The crosscheck
      checks each requirement and the omission check each site; neither
      follows one request from where it enters to where it ends, and a site
      can be judged covered by a requirement whose scenarios never state one
      of its branches. Here a `spec-relay-checker` starts at each entry
      point of source-map.md (a page, a button's or a menu's handler, a
      route, an API, a job, a public function other capabilities call),
      follows the code to the end, into every file it calls (shared code,
      base classes, includes, master pages, configuration, database
      triggers and procedures), and lists every behavior a user or caller
      can notice on the way: each input check and its message, each branch
      that changes the result, calculations and rounding, defaults, the
      order of lists, paging, permissions, writes, mails, files, redirects,
      calls to other systems, error handling and what the user then sees.
      It gets the specs, screens.md and source-map.md only (never trace.md
      or the analysts' notes), so it finds the code itself. Give it its
      entry points as `draft.mjs items --change <change>` prints them, with
      the numbered requirement and screen names; for a large capability,
      several checkers take groups of entry points in one wave, each writes
      `openspec/spec-relay/work/<change>/walkthrough/<nn>.md`, merged into
      this file by the kit's `merge.mjs`.

      One table, `| Entry point | Behavior | Verdict | Evidence |`, with one
      row per behavior and the entry point id in every row, exactly as
      source-map.md lists it. The verdict is one of:
      - `covered R<n>: <scenario name>`: that scenario states the behavior
        with its condition and values (several as `covered R2: <a>; R5:
        <b>`). `covered S<n>` for what screens.md states (a label, a
        message, a transition).
      - `vague R<n>: <scenario name>`: a scenario touches the behavior but
        does not state the condition or the values an implementer needs.
      - `other capability <path>`: the behavior is wholly another
        capability's (a sign-in check in platform); the evidence cites the
        line in a file the plan gives that capability.
      - `question Q<n>`: the person must decide.
      - `gap`: no scenario or screen states it.
      An entry point the checker finds that source-map.md does not list is
      walked too; the analyst then adds it to source-map.md. Resolve every
      `gap` and `vague` row: an analyst adds the requirement it needs (with
      its trace) at the END of the spec, or makes the scenario concrete, a
      checker crosschecks that requirement and walks the entry point again
      (merged on its own, its rows replace all the rows of that entry point), or the
      orchestrator moves it to questions.md and writes `question Q<n>`.
      The evidence of every row cites the code: `path:line` (a range of at
      most 40 lines) or `path:Class.Method`, in backticks, from the
      repository root, of a file that exists, with lines the file has, and
      what the code does. Only `covered` rows count for the effect lines
      below. A behavior moved to a question keeps its requirement in the
      evidence (`R2: ...`).
      `gate.mjs review` fails while an entry point of source-map.md has no
      row, a row walks an entry point source-map.md does not list or has an
      empty Entry point cell, a row has no behavior or cites no existing
      code, a verdict is `gap`, `vague`, blank or another word, names a
      requirement, scenario, screen, question or capability that does not
      exist, or names another capability without citing its code. It also
      fails while a requirement has no row that names one of its scenarios
      (a way in is missing or a walk stopped early), and while an effect
      line (a write, a mail, an error, a redirect, the end of a request) of
      a site coverage.md judges `covered` is cited by no row: a walk that
      stops at the first file reaches none of them. Merge each wave of
      checkers on its own: the rows one merge brings for an entry point, from
      all its parts, replace the rows it had, and merge.mjs lists the `gap`
      and `vague` rows that are gone, which the orchestrator confirms the
      spec now states.
    requires:
      - source-map
      - specs
      - screens

  - id: questions
    generates: questions.md
    description: Ambiguities, suspected bugs and assumptions that need a human decision
    template: questions.md
    instruction: |
      List everything the human reviewer must decide before the spec becomes
      the baseline:
      - **Suspected bugs**: behavior that looks unintended. Ask: keep as-is in
        the new language, or fix (a fix is a separate change after migration).
      - **Ambiguities**: behavior the code does not make clear, such as
        unreachable branches, configuration-dependent paths or dead code.
      - **Assumptions**: anything you inferred instead of reading it in code,
        including behavior of database objects whose definitions are missing
        (the survey's database.md, Missing definitions).
      - **Not migrated**: parts you propose to leave out, with the reason.

      Give each item an id (Q1, Q2, ...), the related requirement and the
      source reference. Write "None" under a heading with no items.
      Under every question, give the answer you recommend and why, as two
      list lines indented by two spaces, with these English labels:
      `  - Recommended: <the answer, one line the reviewer can take as the
      decision>` and `  - Why: <the reason, with the source reference or the
      fact that supports it>`. For a suspected bug, the usual recommendation
      is to keep the behavior (a fix is follow-up work after the migration);
      say when the evidence points the other way. When nothing in the code or
      the artifacts supports any answer, write `Recommended: none` and say in
      Why what would decide it (whom to ask, which record to look at); never
      guess without saying so. Keep each line on one line where you can; a
      line that wraps continues indented deeper. The reviewer decides; the
      review page shows the recommendation beside the decision and lets the
      reviewer take it as it is. `gate.mjs review` fails on a question
      without both lines.
      Include every crosscheck, coverage and walkthrough row that was
      resolved as `question Q<n>`.
    requires:
      - crosscheck
      - coverage
      - walkthrough

  - id: review
    generates: review.md
    description: Human review checklist; the change may be archived only when every box is ticked by the reviewer
    template: review.md
    instruction: |
      Build the checklist the HUMAN reviewer works through (step 4).
      Write it with `node "<kit>/scripts/draft.mjs" review --change <change>`,
      which builds this list from the artifacts; after a change that adds,
      renames or removes a subject, run it again with `--update`, which keeps
      the reviewer's ticks, decisions and notes. Do not retype the list.
      `gate.mjs review` checks this structure before the change may be archived.
      - Keep the `Reviewer:` line; the reviewer's name goes there.
      - One checkbox per requirement: `- [ ] R<n> <requirement name>` under
        `## 1. Requirements`, in spec order.
      - One checkbox per screen: `- [ ] S<n> <screen name>` under
        `## 2. Screens`, in screens.md order. When screens.md says None,
        write the single item `- [ ] S0 This capability has no screens`
        instead.
      - One checkbox per question: `- [ ] Q<n> <short title>: decision: ...`
        under `## 3. Questions`. Leave the decision blank.
      - Under `## 4. Coverage`, only when coverage.md judges sites that hold
        marker lines as `no behavior`, or sets marker lines aside with `no
        effect`: one checkbox, with the text `gate.mjs review` gives:
        `- [ ] C1 The marker lines of <n> sites are judged to hold nothing
        to migrate (list <code>)`. The code names the list as it is now
        (the review page shows the list and the same code); the gate fails
        while the item is missing or names another list. When the list
        changes, write the new text and leave the item unticked. Without
        such sites, leave the heading out.

      Do not tick any box. Only the reviewer decides; see the apply instruction.
    requires:
      - source-map
      - specs
      - screens
      - trace
      - crosscheck
      - coverage
      - walkthrough
      - questions

apply:
  requires: [ review ]
  tracks: review.md
  instruction: |
    Applying this change is the HUMAN REVIEW (spec-relay step 4). It never
    edits the source code or writes target-language code.

    Render the review page first (`render.mjs --change <change>`) and give the
    person its path: it shows each requirement with its scenarios, the source
    lines and the crosscheck verdict. The reviewer may review in this
    conversation, or in the files or a pull request and tell you when done.
    Walk the reviewer through review.md one item at a time: show the
    requirement (or screen, or question) with its trace entry, and ask the
    reviewer to accept it, ask for a change, or record a decision.
    - Tick a box only after the reviewer explicitly accepts that item in this
      conversation, or when the reviewer ticked it themselves.
    - A line `  - fix: ...` under an item is the reviewer asking for a change
      (written in the file or with the canvas); `  - hold: ...` means they
      cannot decide yet. Answer each fix by correcting the artifacts and
      writing `  - fixed: <what you changed>` under it; keep the item
      unticked. Never delete or reword the reviewer's notes.
    - When the reviewer asks for a change, edit specs/screens/trace/questions
      first, have the checker check the changed rows again, untick every item
      you changed, render again, and ask again.
    - Write the reviewer's decision after `decision:` on each question line.
    Never tick a box on your own judgment. When every box is ticked, tell the
    reviewer that archiving the change makes the spec the migration baseline,
    and archive only after they say so.
