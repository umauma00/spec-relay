# spec-relay: managed by scripts/setup.mjs. Edit the values; keep this line.
schema: spec-relay-extract

context: |
  This repository is being migrated to another programming language with spec-relay.
  Source language: {{SOURCE_LANGUAGE}}
  Source root (read-only; only openspec/ and the target root may change): {{SOURCE_ROOT}}
  Target language: {{TARGET_LANGUAGE}}
  Target root (new implementation): {{TARGET_ROOT}}
  Artifact language: {{ARTIFACT_LANGUAGE}}
  Parallel subagents (at once, whole session): {{PARALLEL}}
  Analyses ahead of review: {{AHEAD}}
  Analyst model: {{ANALYST_MODEL}}
  Checker model: {{CHECKER_MODEL}}
  Implementer model: {{IMPLEMENTER_MODEL}}
  Hook enforcement (on or off; on denies archives that fail the gate and agent writes to protected files): {{HOOKS}}
  Write all artifacts in the artifact language, but keep OpenSpec structural
  headings and SHALL/MUST keywords in English.
  The survey (schema spec-relay-survey) splits the source code into DDD bounded
  contexts and capabilities; the target design (schema spec-relay-target)
  decides the modules, conventions and verification of the new system.
  Extract changes (schema spec-relay-extract) describe current behavior of the
  source code. Port changes (schema spec-relay-port) implement archived
  baseline specs in the target language without changing behavior. Amend
  changes (schema spec-relay-amend) correct a baseline that misread the code.

rules:
  specs:
    - Specify what the source code does today, even when it looks wrong; raise doubts as questions for questions.md.
  tasks:
    - Every task cites the requirement, the target file and the source reference it reads.
